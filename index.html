9",label:"Capítulo 9",title:"Sua rotina diária",short:"Horários que fazem sentido",quote:"Quando a rotina tem ritmo, o corpo para de viver no susto.",pages:5,icon:"🕰️",group:"rotina"},{id:"capitulo-10",label:"Capítulo 10",title:"Mitos e verdades",short:"Sem terrorismo nutricional",quote:"Informação boa acalma. Informação ruim faz a gente cortar o que ama.",pages:4,icon:"💬",group:"rotina"},{id:"capitulo-11",label:"Capítulo 11",title:"Seu plano de 21 dias",short:"Com lista de compras",quote:"Não é uma dieta de 21 dias. É um jeito novo de chegar amanhã.",pages:6,icon:"🗓️",group:"rotina"},{id:"mensagem-final",label:"Encerramento",title:"Uma mensagem para você",short:"O próximo passo é acender o fogo",quote:"Progresso é melhor que perfeição.",pages:1,icon:"💌",group:"rotina"},{id:"tabela-nutrientes",label:"Consulta rápida",title:"Tabela de nutrientes",short:"Os 12 ingredientes",quote:"Consulte sempre que for à feira.",pages:2,icon:"📊",group:"rotina"}],Cv=[{time:"07h",meal:"Café da manhã",rec:"Suco verde + tapioca de cúrcuma com ovo",why:"Seu corpo passou a noite sem comer. O cortisol (hormônio do despertar) está alto e precisa de proteína e fibra, não de café puro e pressa. Comer de verdade aqui evita o ataque de fome das 10h."},{time:"10h",meal:"Lanche da manhã",rec:"Banana assada com aveia ou mix de frutas",why:"Intervalo de 3h para estabilizar a energia. Não é obrigatório comer se não sentiu fome; é melhor do que chegar faminta ao almoço e comer rápido demais."},{time:"12h30",meal:"Almoço",rec:"Arroz integral com cúrcuma + frango ao gengibre + salada",why:"O sistema digestivo está no auge. Um prato com proteína, carboidrato integral e vegetais controla o pico de insulina e sustenta a tarde."},{time:"15h30",meal:"Lanche da tarde",rec:"Cookies de aveia e banana ou iogurte com manga",why:"É o horário em que o açúcar no sangue costuma cair e a vontade de doce aparece. Um lanche com fibra e proteína evita que a vontade vire pacote de biscoito."},{time:"19h",meal:"Jantar",rec:"Sopa de legumes com gengibre ou omelete de forno",why:"Refeição mais leve, com proteína e vegetais. Deixar 2 a 3 horas entre o jantar e a cama ajuda o sono e a digestão. Não é proibido comer depois — é só organizar o ritmo."}],zf=[{time:"07h",title:"Café da manhã",detail:"Suco verde desinchado + tapioca de cúrcuma com ovo mexido",chapter:"capitulo-4"},{time:"10h",title:"Lanche",detail:"Banana assada com aveia e canela",chapter:"capitulo-6"},{time:"12h30",title:"Almoço",detail:"Arroz integral colorido + frango ao molho de gengibre e limão + salada de folhas",chapter:"capitulo-5"},{time:"15h30",title:"Lanche",detail:"Mousse de abacate com cacau",chapter:"capitulo-6"},{time:"19h",title:"Jantar",detail:"Sopa cremosa de abóbora com gengibre + ovo cozido",chapter:"capitulo-7"},{time:"21h",title:"Ritual",detail:"Chá de camomila com canela — e o celular longe da cama",chapter:"capitulo-8"}],Ev=["Iogurte natural com banana amassada e canela.","Ovo cozido com sal e azeite, comido com palitos de cenoura.","Tapioca com queijo minas e orégano.","Fatias de abacate com limão, sal e gergelim.","Água com limão e hortelã no lugar do refrigerante.","Punhado de castanhas sem sal + uma fruta da estação.","Cuscuz de milho rápido com ovo mexido."],Tv=[{name:"Açafrão-da-terra (cúrcuma)",emoji:"🟡",tagline:"O dourado que acalma a inflamação",what:"É a raiz que dá a cor amarela ao curry. O composto ativo, a curcumina, ajuda o corpo a lidar com a inflamação que o estresse e a alimentação cheia de ultraprocessados deixam no corpo.",nutrients:["Curcumina","Vitamina B6","Ferro","Potássio","Manganês"],slimming:"Não queima gordura sozinho, mas quando a inflamação baixa, o corpo responde melhor a mudanças na alimentação e o inchaço diminui. É tempero no lugar do caldo pronto.",choose:"Procure a raiz fresca, firme, de casca fina e laranja intenso. Em pó, prefira amarelo vivo e cheiro forte, comprado a granel em local de muita rotatividade.",store:"A raiz dura até 2 semanas na geladeira, embrulhada em papel. O pó fica em pote escuro e fechado, longe do sol, por até 6 meses."},{name:"Gengibre",emoji:"🫚",tagline:"O amigo da digestão e do inchaço",what:"Um rizoma de sabor picante que ajuda a digestão, aquece e pode aliviar enjoo. Muitas mulheres sentem o intestino mais lento depois dos 35 — ele dá aquela movimentada.",nutrients:["Gingerol","Vitamina C","Magnésio","Potássio","Manganês"],slimming:"Ele pode acelerar um pouquinho o gasto de energia — é o que chamamos de efeito termogênico —, mas esse efeito é pequeno, então não espere milagre. O ganho real é digestivo: menos estufamento, menos vontade de beliscar por desconforto e bebidas caseiras no lugar de refrigerante.",choose:"Raízes pesadas para o tamanho, com casca clara e brilhante e polpa amarelada. Evite pedaços moles, enrugados ou com mofo.",store:"Dura 3 semanas na geladeira, em papel toalha dentro de pote. Pode congelar ralado em forminhas de gelo, coberto com água."},{name:"Canela",emoji:"🟤",tagline:"Doçura de cheiro, sem açúcar",what:"Uma casca de árvore aromática. Além de perfumar, traz aquela sensação de conforto que geralmente a gente busca no doce. Usar canela é treinar o paladar para sentir doce sem açúcar.",nutrients:["Cinamaldeído","Magnésio","Cálcio","Ferro","Fibras"],slimming:"A canela pode ajudar a evitar picos de açúcar no sangue depois da refeição e diminui a vontade de doces. É o truque mais simples para transformar fruta em sobremesa.",choose:"Prefira canela em pau, quebradiça e aromática. A canela do Ceilão (mais clara e em camadas) é a ideal para uso diário; a cassia é mais intensa.",store:"Em pote de vidro fechado, na despensa escura, por até 1 ano. Em pó, mantenha em recipiente bem vedado e longe do calor."},{name:"Limão",emoji:"🍋",tagline:"O azedinho que abre o apetite certo",what:"Além de dar frescor, o limão é fonte de vitamina C, que ajuda o corpo a absorver o ferro dos vegetais e a manter a imunidade. O suco também serve de base para molhos caseiros sem conservantes.",nutrients:["Vitamina C","Folato","Potássio","Flavonoides","Fibras"],slimming:"O limão não derrete gordura. Ele permite que você tempere a comida com sabor forte e use menos sal, e troca o refrigerante por água com limão, o que reduz muito a energia líquida do dia.",choose:"Escolha limões pesados, de casca uniforme e fina. Os mais firmes duram mais; os que cedem levemente anúncio mais suco.",store:"Fora da geladeira por 3 dias ou na gaveta de legumes por 2 semanas. O suco congelado em cubinhos é ótimo para a semana."},{name:"Mel",emoji:"🍯",tagline:"Adoçante natural — que ainda é açúcar",what:"O mel é um adoçante feito pelas abelhas a partir do néctar das flores. Tem antioxidantes e compostos que ajudam a garganta e a imunidade. A regra é clara: natural não significa liberado.",nutrients:["Antioxidantes","Enzimas","Vitamina B6","Cálcio","Ferro"],slimming:"Não emagrece. Entra em pequena quantidade para substituir o açúcar refinado e adoçar o que realmente importa: mingau, chá, bolo caseiro. Uma colher de chá é tempero; três não viram saúde.",choose:"Prefira o mel mais escuro, com cheiro floral forte, de produtor local. Ele tende a ter mais antioxidantes. O rótulo deve dizer apenas mel — sem xarope.",store:"Em pote de vidro bem fechado, em local seco e longe do sol. Se cristalizar, aqueça o pote em banho-maria morno."},{name:"Espinafre",emoji:"🥬",tagline:"Folha verde que carrega ferro",what:"Uma folha escura que concentra vários nutrientes importantes para a mulher — ferro, folato e vitamina K. É barato, rende muito e entra em ovos, sopas, sucos e recheios.",nutrients:["Ferro","Folato","Vitamina K","Vitamina A","Magnésio"],slimming:"Tem pouquíssimas calorias e uma cheia de água e fibras, então aumenta o volume da refeição sem pesar. Fibras dão saciedade e ajudam o intestino, dois pontos que fazem diferença na balança.",choose:"Folhas verdes escuras, firmes, sem amarelos ou pontos moles. Os talos finos e macios preservam o sabor leve.",store:"Lave, seque bem e guarde em pote fechado com papel-toalha na geladeira por até 5 dias. Pode congelar já refogado em porções."},{name:"Abóbora",emoji:"🎃",tagline:"Doçura laranja cheia de fibras",what:"A abóbora cabotiá é a nossa estrela do outono/inverno. Além de ser uma delícia em sopas e assados, alimenta o corpo com betacaroteno, que se transforma em vitamina A e ajuda pele, visão e imunidade.",nutrients:["Betacaroteno","Vitamina A","Vitamina C","Potássio","Fibras"],slimming:"Uma sopa de abóbora rende volume enorme com pouca energia. As fibras e a água aumentam a saciedade, e a doçura natural substitui receitas com açúcar. Cozinhe sem creme de leite industrializado.",choose:"Escolha uma abóbora firme, com casca laranja sem manchas mole. O talo seco e a batida oca são sinais de boa maturação.",store:"Inteira, ao abrigo da luz por 2 semanas. Picada, em pote fechado na geladeira por até 5 dias ou congelada por 3 meses."},{name:"Banana",emoji:"🍌",tagline:"O doce da feira que segura a fome",what:"A fruta brasileira mais democrática. Tem carboidrato, fibras e potássio, e serve para adoçar receitas naturalmente. A escolha do estágio de maturação muda o sabor e a velocidade com que a glicose sobe.",nutrients:["Potássio","Vitamina B6","Magnésio","Fibras","Vitamina C"],slimming:"Fibras e potássio ajudam no intestino e no inchaço; a doçura natural mata a vontade de doce. Coma a banana inteira, com aveia ou ovo, em vez de suco de banana — mastigar e combinar segura a fome por mais tempo.",choose:"Para hoje, amarela com pontos. Para a semana, mais verde. Para bolo, quanto mais madura, melhor — manchas escuras são doçura, não estrago.",store:"Fora da geladeira, em local fresco e arejado. Para desacelerar a maturação, separe do cacho e deixe em cabeço de guardanapo. Congele em rodelas para vitaminas."},{name:"Aveia",emoji:"🌾",tagline:"A fibra que faz o mingau virar escudo",what:"Cereal integral com uma fibra especial, a beta-glucana, que forma uma espécie de gel no estômago. É barata, rende muito e serve para o café, o lanche e para substituir a farinha branca.",nutrients:["Beta-glucana","Fibras solúveis","Proteína vegetal","Magnésio","Ferro"],slimming:"A beta-glucana retarda o esvaziamento do estômago e prolonga a saciedade. Um café com aveia evita beliscar às 10h. Além disso, ajuda a controlar o colesterol e alimenta as bactérias boas do intestino.",choose:"Prefira aveia em flocos, que tem o grão mais inteiro e mais fibras do que a farinha. Confira a lista de ingredientes: deve ter só aveia.",store:"Em pote hermético, na despensa seca, por até 6 meses. Em climas úmidos, guarde na geladeira para não azedar. Não precisa lavar."},{name:"Ovo",emoji:"🥚",tagline:"Proteína completa e versátil",what:"O ovo é um dos alimentos mais completos que existem: tem todos os aminoácidos essenciais e várias vitaminas, inclusive a D. Foi injustiçado por anos por causa do colesterol — a ciência já mudou de opinião.",nutrients:["Proteína completa","Colina","Vitamina D","Vitamina B12","Selênio"],slimming:"Proteína é o nutriente que mais ajuda na saciedade. Começar o dia com ovos costuma significar menos fome e menos petiscos pela manhã. E o ovo é barato, o que faz dele o melhor amigo do orçamento.",choose:"Prefira ovos com casca íntegra e limpa, sem cheiro. Se for comprar de produtor local, melhor ainda: ovos frescos têm gema mais firme.",store:"Na geladeira, na própria embalagem, longe da porta. Duram cerca de 3 a 4 semanas. Gema crua no liquidificador não é necessário — cozinhe bem."},{name:"Batata-doce",emoji:"🍠",tagline:"Energia de verdade, doçura sem pressa",what:"Um carboidrato de raiz, cheio de fibras e betacaroteno. Cozida ou assada, ela libera energia mais gradualmente que o pão branco e é muito mais saciante do que parece.",nutrients:["Betacaroteno","Vitamina A","Vitamina C","Potássio","Fibras"],slimming:"As fibras e a água aumentam a saciedade, então uma porção moderada substitui pão, farinha e purê. Resfriada e reaquecida, parte do amido dela se comporta como fibra, e o efeito de saciedade aumenta.",choose:"Escolha raízes pequenas a médias, firmes, com pele lisa e sem furos de bicho. As maiores e moles tendem a ser menos saborosas e amadurecem rápido.",store:"Inteira, em local seco e arejado, por até 2 semanas. Cozida, na geladeira por 4 dias. Congele purê em porções para a semana."},{name:"Hibisco",emoji:"🌺",tagline:"Flor vermelha para um ritual de tarde",what:"A flor seca do hibisco faz um chá vermelho lindo, cítrico e levemente azedo. Tradicionalmente associado à hidratação e à pressão arterial, é vendido a granel em feiras e casas de produtos naturais.",nutrients:["Antocianinas","Vitamina C","Antioxidantes","Minerais","Flavonoides"],slimming:"Não emagrece sozinho, mas hidrata e substitui bebidas açucaradas. O chá também dá a sensação de pausa na tarde, que é onde a alimentação costuma escapar. Cuidado com versões açucaradas e o excesso se você tem pressão baixa ou toma medicação.",choose:"Flores inteiras, de cor vermelho profundo, sem pó e sem cheiro de guardado. Compre a granel e cheire: deve ser agradável e frutado.",store:"Pote fechado, ao abrigo da luz, por até 1 ano. Rende muito: uma colher de sopa por caneca é o suficiente."}],fn=[{instead:"Pão francês com manteiga",choose:"Tapioca com ovo e cúrcuma",why:"O pão branco vira açúcar rápido; a tapioca com ovo adiciona proteína e segura a fome."},{instead:"Refrigerante no almoço",choose:"Suco de limão com gengibre e água",why:"Troca uma dose de açúcar líquido por hidratação e sabor azedinho."},{instead:"Bolo de chocolate comprado",choose:"Bolo de banana com canela e mel",why:"A banana adoça e a aveia traz fibra. Sem farinha branca, sem gordura hidrogenada."},{instead:"Batata frita ou frituras",choose:"Legumes assados com cúrcuma e azeite",why:"Assar reduz a gordura da fritura e mantém a crocância que você gosta."},{instead:"Arroz branco todos os dias",choose:"Arroz integral com cúrcuma",why:"As fibras do integral prolongam a saciedade e a cúrcuma tempera sem molho pronto."},{instead:"Molho de tomate pronto",choose:"Molho de tomates frescos com manjericão",why:"Tomate, alho, azeite e sal: sem açúcar escondido nem conservantes."},{instead:"Margarina na torrada",choose:"Pasta de abacate com limão",why:"Gordura boa que sacia, em vez de gordura trans e óleos refinados."},{instead:"Iogurte de morango açucarado",choose:"Iogurte natural com manga e canela",why:"Mesmos probióticos, sem o açúcar e os aromatizantes da versão saborizada."},{instead:"Suco de caixinha",choose:"Água aromatizada com limão e hortelã",why:"Frutas inteiras têm fibra; suco de caixinha costuma ser açúcar com aroma."},{instead:"Pão de queijo frito",choose:"Pão de queijo assado de batata-doce",why:"Assado e com batata-doce, tem mais fibra e menos gordura — e ainda é gostoso."},{instead:"Salgadinho de pacote",choose:"Chips de batata-doce assada",why:"A crocância continua; o excesso de sal e óleo refinado vai embora."},{instead:"Chocolate ao leite",choose:"Mousse de abacate com cacau",why:"Cacau de verdade + gordura boa substitui o açúcar do chocolate ao leite."},{instead:"Leite condensado no café",choose:"Leite, café e uma pitada de canela",why:"Você mantém o creme e o aroma sem colocar colheradas de açúcar no dia."},{instead:"Macarrão só com molho e queijo",choose:"Tiras de abobrinha com frango e tomate",why:"Troca o prato de carboidrato por um prato que tem proteína e vegetais de verdade."},{instead:"Cereal matinal açucarado",choose:"Aveia com banana, canela e chia",why:"A aveia tem fibra de verdade; o cereal de caixa tem mais açúcar do que grão."},{instead:"Tempero pronto com muito sódio",choose:"Alho, cebola, cúrcuma e ervas frescas",why:"Menos sal e mais sabor. Seu corpo retém menos líquido e você se sente mais leve."},{instead:"Lanche da padaria toda tarde",choose:"Cookies de aveia e banana caseiros",why:"Um doce honesto, feito por você, que você sabe exatamente o que tem dentro."},{instead:"Caldos de carne industrializados",choose:"Caldo de legumes caseiro congelado",why:"Sem realçador de sabor e uma base natural para sopas e cozidos da semana."}],Mv=[{question:"Comer à noite engorda?",verdict:"MITO",answer:"O que pesa é o total do dia, não o relógio. Um jantar leve e nutritivo, como sopa de legumes com ovo, pode até ajudar a dormir melhor. O problema não está na hora, mas em beliscar a noite inteira sem fome de verdade."},{question:"Carboidrato é o vilão?",verdict:"MITO",answer:"Carboidrato é o combustível do corpo, inclusive do cérebro. A diferença está na qualidade e na porção: batata-doce, aveia, feijão e arroz integral alimentam de forma estável, enquanto farinhas e açúcares em excesso desestabilizam. Cortar tudo costuma gerar fome e retorno em dobro."},{question:"Preciso cortar tudo que gosto?",verdict:"MITO",answer:"Se a alimentação for um castigo, ninguém mantém. Você não vai parar de comer: vai trocar o que come e aprender a caber na sua vida. Bolo de banana caseiro, panqueca, pão de queijo de batata-doce e mousse de abacate estão nos capítulos — comida gostosa não é exceção."},{question:"Metabolismo lento não tem solução?",verdict:"MITO",answer:"O metabolismo pode ficar mais lento com idade, perda de músculo, sono ruim e anos de dietas muito restritivas. Mas ele não está travado. Proteína em todas as refeições, força (pode ser em casa), sono e comida suficiente ajudam o corpo a voltar a responder."},{question:"Fruta engorda por causa do açúcar?",verdict:"MITO",answer:"Fruta tem água, fibras e nutrientes que atrasam a absorção do açúcar. Uma banana ou um mamão inteiros são muito diferentes de um suco com açúcar. A não ser em excesso, fruta não é motivo de medo — é parte da solução para a vontade de doce."},{question:"Chá emagrece sozinho?",verdict:"VERDADE PELA METADE",answer:"Chás hidratam, podem reduzir o inchaço e ajudam a substituir bebidas açucaradas. Mas nenhum chá queima gordura por conta própria. Ele é apoio: sozinho, sem comida de verdade e rotina, não faz diferença na balança."}],Sf=[{ingredient:"Cúrcuma",emoji:"🟡",vitamins:"B6
