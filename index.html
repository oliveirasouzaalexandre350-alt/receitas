volume ao estômago, o que ajuda a segurar a fome até o almoço. O gengibre apoia a digestão e o limão entrega vitamina C. É leve, mas não é milagre: ele entra no lugar do refrigerante, não no lugar da comida.",photo:"copo alto de suco verde com folhas de espinafre, rodelas de abacaxi, gengibre e limão ao redor, luz da manhã sobre bancada de mármore clara"},{id:"mingau-aveia",name:"Mingau de aveia com canela e mel",category:"cafe",emoji:"🌾",time:"10 min",servings:"1 porção",ingredients:["3 colheres de sopa de aveia em flocos","200 ml de leite ou bebida vegetal caseira","½ banana madura amassada","1 pitada generosa de canela em pó","1 colher de chá de mel","1 colher de chá de chia (opcional)"],steps:["Leve a aveia e o leite a uma panela pequena em fogo baixo.","Mexa sem parar por cerca de 5 minutos, até engrossar.","Junte a banana, a canela e a chia e cozinhe por mais 1 minuto.","Desligue, acrescente o mel e sirva morno."],why:"A aveia tem beta-glucana, uma fibra que forma um gel no intestino e prolonga a saciedade — aquele mingau quentinho ajuda a não chegar faminta no almoço. A canela adoça o sabor de forma natural e a banana entrega potássio e doçura sem açúcar refinado.",photo:"tigela de cerâmica rústica com mingau cremoso de aveia, rodelas de banana e canela por cima, jarra de leite e canela em pau ao lado, luz suave de janela"},{id:"tapioca-acafrao",name:"Tapioca de cúrcuma com ovo mexido",category:"cafe",emoji:"🟡",time:"8 min",servings:"1 porção",ingredients:["3 colheres de sopa de goma de tapioca","½ colher de chá de cúrcuma em pó","2 ovos","½ tomate picado","1 punhado de espinafre fresco","Azeite de oliva, sal e pimenta-do-reino a gosto"],steps:["Misture a goma com a cúrcuma e peneire na frigideira quente.","Espalhe bem e deixe firmar por 2 minutos; vire e desligue.","Em outra frigideira, refogue o tomate e o espinafre no azeite.","Junte os ovos batidos, mexa até cozinhar e tempere.","Recheie a tapioca ainda quente, dobre e sirva."],why:"A tapioca sozinha é só carboidrato e some rápido da fome. Ao acrescentar ovos, você adiciona proteína de alta qualidade e colina, que participam do funcionamento do cérebro e dos hormônios. A cúrcuma tem ação anti-inflamatória e a pimenta ajuda o corpo a aproveitá-la melhor.",photo:"crepe de tapioca dourado de cúrcuma dobrado com ovos mexidos e espinafre aparecendo, prato branco com borda artesanal, ervas frescas e limão ao redor, luz natural de manhã"},{id:"panqueca-banana",name:"Panqueca de banana e aveia",category:"cafe",emoji:"🍌",time:"10 min",servings:"1 porção (3 panquequinhas)",ingredients:["1 banana madura","1 ovo","2 colheres de sopa de aveia em flocos","½ colher de chá de canela em pó","1 colher de chá de mel (para servir)","Óleo de coco para untar"],steps:["Amasse a banana com um garfo até formar um purê.","Misture o ovo, a aveia e a canela até a massa ficar uniforme.","Aqueça uma frigideira untada com um fio de óleo de coco.","Coloque colheradas da massa, doure dos dois lados em fogo baixo.","Sirva com o mel e mais uma pitada de canela."],why:"Essa panqueca mata a vontade de doce com fruta, ovo e aveia — sem açúcar refinado. A combinação de fibras da aveia e proteína do ovo estabiliza a energia da manhã e ajuda a evitar a fome de beliscar às 10h. A banana traz potássio, importante para quem retém líquido.",photo:"pilha de três mini panquecas douradas de banana e aveia em prato de cerâmica crua, mel escorrendo e fatias de banana por cima, fundo de madeira rústica com canela em pau"},{id:"smoothie-mamao",name:"Smoothie de mamão com gengibre",category:"cafe",emoji:"🧡",time:"5 min",servings:"2 copos",ingredients:["½ mamão papaia maduro","1 pedaço de 2 cm de gengibre","150 ml de iogurte natural integral","1 colher de sopa de aveia","1 colher de chá de linhaça","150 ml de água gelada"],steps:["Retire as sementes do mamão e corte em pedaços.","Bata o mamão, o gengibre, o iogurte, a aveia e a água.","Acrescente a linhaça e bata rapidamente.","Beba na hora, sem coar, para aproveitar as fibras."],why:"O mamão tem papaína, uma enzima que ajuda a digestão das proteínas, enquanto o gengibre auxilia o intestino a funcionar melhor. O iogurte natural soma proteína e as fibras da aveia e da linhaça prolongam a saciedade. É o famoso “desinchar”, sem laxante.",photo:"smoothie cremoso de mamão e gengibre em dois copos de vidro com rodelas de mamão, fatias de gengibre e sementes de linhaça ao lado, mesa de pedra clara em luz natural"},{id:"cuscuz-ovo",name:"Cuscuz de milho com ovo e tomate",category:"cafe",emoji:"🌽",time:"12 min",servings:"1 porção",ingredients:["½ xícara de flocos de milho para cuscuz","Cerca de 6 colheres de sopa de água","1 pitada de sal","2 ovos","½ tomate picado","¼ de cebola picada","Cúrcuma, azeite e coentro a gosto"],steps:["Hidrate os flocos de milho com água e o sal por 5 minutos.","Cozinhe no vapor por 6 minutos, com a panela tampada.","Refogue a cebola e o tomate no azeite, junte os ovos e a cúrcuma.","Mexa até o ovo ficar cozido e finalize com coentro.","Sirva o cuscuz quente com o ovo por cima."],why:"Cuscuz de milho é comida de verdade: carboidrato complexo com fibras, que libera energia lentamente. O ovo completa a refeição com proteína, evitando aquela montanha-russa de acordar cheia e cair de fome no meio da manhã. Cúrcuma e azeite somam cor e ação anti-inflamatória.",photo:"cuscuz de milho amarelo em prato de barro, coberto por ovos mexidos, tomate e coentro fresco, café na caneca de cerâmica e mão de mulher segurando garfo, luz quente de cozinha"},{id:"overnight-banana",name:"Aveia de geladeira com banana e canela",category:"cafe",emoji:"🫙",time:"5 min + geladeira",servings:"1 porção",ingredients:["3 colheres de sopa de aveia em flocos","1 colher de sopa de chia","120 ml de leite ou iogurte natural","½ banana em rodelas","1 pitada de canela","1 colher de chá de mel"],steps:["Coloque a aveia, a chia e o leite em um pote com tampa.","Acrescente a metade das rodelas de banana e o mel.","Feche e deixe na geladeira de véspera para o dia seguinte.","Na hora de comer, adicione a outra metade da banana e a canela."],why:"Deixar a aveia de molho faz a fibra ficar mais acessível e o preparo mais gostoso. Chia e aveia formam um gel que aumenta a saciedade e ajuda no trânsito intestinal. Já deixando pronto na noite anterior, você evita sair de casa com o estômago vazio e comprar algo por impulso.",photo:"pote de vidro com aveia de geladeira, camadas de banana e chia, canela salpicada por cima, colher de madeira e pote destampado sobre linho cru, luz suave matinal"},{id:"vitamina-abacate",name:"Vitamina de abacate com cacau",category:"cafe",emoji:"🥑",time:"5 min",servings:"1 copo grande",ingredients:["½ abacate maduro","200 ml de leite ou bebida vegetal caseira","1 colher de sopa de cacau em pó natural","1 colher de chá de mel","1 colher de sopa de aveia","Canela a gosto"],steps:["Corte o abacate e retire a polpa.","Bata a polpa com o leite, o cacau, o mel e a aveia.","Acrescente a canela e bata só para misturar.","Sirva imediatamente, bem gelado."],why:"O abacate é um dos melhores amigos das mulheres acima de 35: gordura boa que ajuda o corpo a produzir hormônios e dá muita saciedade. O cacau natural tem magnésio, mineral que fica mais baixo em fases de estresse, e o cacau em pó não é achocolatado — cuidado para não confundir. Mel só para adoçar.",photo:"copo alto de vitamina cremoso verde-acastanhado de abacate e cacau, cacau polvilhado e rodela de banana, meio abacate e sementes sobre tábua de madeira, luz de janela"},{id:"crepioca-espinafre",name:"Crepioca verde com queijo minas",category:"cafe",emoji:"💚",time:"10 min",servings:"1 porção",ingredients:["1 ovo","2 colheres de sopa de goma de tapioca","1 punhado de espinafre picado","1 colher de sopa de queijo minas fresco","3 rodelas de tomate","Azeite, sal e orégano a gosto"],steps:["Bata o ovo com a tapioca, o sal e o espinafre.","Aqueça a frigideira com um fio de azeite.","Despeje a mistura e espalhe em disco fino.","Quando soltar do fundo, vire, coloque queijo e tomate.","Dobre, tampe por 1 minuto para o queijo amolecer e sirva."],why:"Ovo e queijo minas somam proteína no café da manhã, o que ajuda a controlar a fome e a vontade de beliscar ao longo do dia. O espinafre traz ferro, folato e vitaminas que participam da produção de energia. E o verde fica bonito — comer também entra pelos olhos.",photo:"crepioca verde dobrada ao meio com queijo minas derretido e tomate, prato raso de cerâmica clara, folhas de espinafre frescas e limão ao lado, luz natural de cozinha brasileira"},{id:"iogurte-manga",name:"Iogurte natural com manga e crocância de aveia",category:"cafe",emoji:"🥭",time:"5 min",servings:"1 porção",ingredients:["1 pote de iogurte natural integral","½ manga madura em cubos","2 colheres de sopa de aveia em flocos","1 colher de chá de castanhas picadas","Canela e mel a gosto"],steps:["Coloque o iogurte em uma tigela.","Espalhe a manga e a aveia por cima.","Salpique as castanhas e a canela.","Finalize com um fiozinho de mel e sirva na hora."],why:"O iogurte natural entrega proteína e bactérias boas para o intestino; a manga acrescenta fibra e vitamina A; a aveia e as castanhas dão a crocância que faz a gente se sentir satisfeita. É uma opção para os dias em que não existe tempo nem para acender o fogo.",photo:"tigela branca com iogurte natural, cubos de manga, aveia tostada e castanhas picadas, colher de cerâmica e uma manga cortada ao lado, luz fresca de manhã sobre linho"}],fv=[{id:"arroz-acafrao",name:"Arroz integral colorido com cúrcuma",category:"almoco",emoji:"🍚",time:"35 min",servings:"4 porções",ingredients:["1 xícara de arroz integral cru","2 xícaras de água quente","1 colher de chá de cúrcuma em pó","½ cebola picada","2 dentes de alho picados","1 colher de sopa de azeite","Cebolinha, sal e pimenta a gosto"],steps:["Refogue a cebola e o alho no azeite até ficarem transparentes.","Junte o arroz e a cúrcuma e mexa por 1 minuto.","Acrescente a água, o sal e a pimenta, tampe e cozinhe em fogo baixo.","Cozinhe por cerca de 30 minutos, até a água secar.","Desligue, tampe por 5 minutos e finalize com cebolinha."],why:"O arroz integral mantém a casca com fibras e minerais, então demora mais para virar açúcar no sangue e segura a fome por mais tempo. A cúrcuma dá cor e ação anti-inflamatória sem precisar de temperos prontos. Cuidado só com o tamanho da porção: uma boa fonte de energia ainda é energia.",photo:"arroz integral amarelo de cúrcuma em tigela de barro, cebolinha picada, colher de pau, cebola e açafrão-da-terra sobre mesa rústica de madeira, luz natural lateral"},{id:"frango-gengibre-limao",name:"Frango ao molho de gengibre e limão",category:"almoco",emoji:"🍗",time:"30 min",servings:"4 porções",ingredients:["500 g de sobrecoxa de frango sem pele","Suco de 2 limões","1 pedaço de 3 cm de gengibre ralado","3 dentes de alho amassados","1 colher de sopa de mel","2 colheres de sopa de azeite","Sal, pimenta e salsinha a gosto"],steps:["Tempere o frango com limão, alho, sal e pimenta por 10 minutos.","Aqueça o azeite e doure o frango dos dois lados.","Misture o gengibre, o mel e 100 ml de água e despeje na panela.","Tampe e cozinhe em fogo baixo por 15 minutos.","Finalize com salsinha e ajuste o sal."],why:"Uma porção de proteína no almoço é o que evita o ataque de fome às 16h. A sobrecoxa sem pele é suculenta e mais acessível que o filé, e o limão ajuda na absorção do ferro presente na refeição. O mel aqui é só para equilibrar o gengibre — não é remédio, é sabor.",photo:"frango dourado ao molho brilhante de gengibre e limão em panela rústica, gengibre e limão em fatias ao redor, salsinha fresca, fundo de mesa de madeira e luz quente de cozinha"},{id:"sopa-abobora",name:"Sopa cremosa de abóbora com gengibre",category:"almoco",emoji:"🎃",time:"30 min",servings:"4 porções",ingredients:["600 g de abóbora cabotiá","1 cebola","2 dentes de alho","1 pedaço de 3 cm de gengibre","800 ml de água","1 colher de sopa de azeite","Sal, pimenta e hortelã a gosto","Sementes de abóbora para finalizar"],steps:["Corte a abóbora, a cebola, o alho e o gengibre em pedaços.","Refogue tudo no azeite por 3 minutos.","Cubra com a água, tempere e cozinhe por 20 minutos.","Bata no liquidificador até ficar cremosa.","Sirva com sementes de abóbora e hortelã."],why:"A abóbora é rica em betacaroteno, que o corpo transforma em vitamina A, e tem muitas fibras. A sopa é feita basicamente de legumes e água, então rende volume sem exagerar nas calorias — perfeita para almoços frios e dias corridos. O gengibre e o azeite ajudam na digestão e na saciedade.",photo:"sopa de abóbora cremosa em tigela de cerâmica rústica, fio de leite de coco, sementes de abóbora e folhas de hortelã por cima, vapor subindo, abóbora cortada ao fundo, luz dourada de janela"},{id:"salada-completa",name:"Salada completa com molho de mel e limão",category:"almoco",emoji:"🥗",time:"15 min",servings:"2 porções",ingredients:["4 punhados de folhas verdes variadas","1 tomate em fatias","½ pepino em meia-lua","1 cenoura ralada","2 ovos cozidos","1 xícara de grão-de-bico cozido","½ abacate em fatias","2 colheres de sopa de azeite","Suco de 1 limão","1 colher de chá de mel","Gergelim, sal e pimenta a gosto"],steps:["Lave e seque as folhas; distribua em duas travessas.","Arrume os legumes, o ovo, o grão-de-bico e o abacate por cima.","Misture o azeite, o limão, o mel, o sal e a pimenta.","Regue a salada na hora de servir e finalize com gergelim."],why:"Uma salada de verdade precisa de protagonistas: proteína do ovo e do grão-de-bico, gordura boa do abacate e cor dos vegetais. Essa combinação mastiga devagar e segura a fome, coisa que alface com sal não faz. O molho caseiro troca o pronto, cheio de conservantes, por azeite, limão e um toque de mel.",photo:"salada colorida em travessa de cerâmica com folhas verdes, tomate, pepino, cenoura, ovo, grão-de-bico e abacate, molho de limão sendo derramado de pequena jarra, luz natural de meio-dia"},{id:"escondidinho-batata",name:"Escondidinho de batata-doce com carne e espinafre",category:"almoco",emoji:"🍠",time:"40 min",servings:"4 porções",ingredients:["600 g de batata-doce","400 g de carne moída magra","1 cebola picada","2 dentes de alho","2 tomates picados","2 xícaras de espinafre","1 colher de sopa de azeite","Cúrcuma, sal e noz-moscada a gosto"],steps:["Cozinhe a batata-doce até ficar macia e amasse com sal e noz-moscada.","Refogue a cebola, o alho e a carne moída no azeite.","Junte os tomates, o espinafre e a cúrcuma e cozinhe por 5 minutos.","Monte em travessa: carne no fundo, purê de batata por cima.","Asse a 200 °C por 15 minutos e sirva com salada."],why:"Esse escondidinho substitui o purê de batata comum por batata-doce, que tem mais fibras e faz o açúcar do sangue subir mais devagar. A carne moída magra e o espinafre completam com proteína e ferro, enquanto o espinafre e a laranja da batata-doce ajudam na absorção. É comida de conforto que também sustenta.",photo:"escondidinho de batata-doce gratinado em travessa rústica, porção em prato com espinafre refogado ao lado, garfo de madeira e cebola sobre mesa de madeira, luz quente de forno"},{id:"omelete-espinafre",name:"Omelete de espinafre com cúrcuma",category:"almoco",emoji:"🍳",time:"15 min",servings:"2 porções",ingredients:["4 ovos","2 xícaras de espinafre fresco","½ tomate picado","¼ de cebola picada","½ colher de chá de cúrcuma","1 colher de sopa de azeite","Sal e pimenta a gosto"],steps:["Bata os ovos com a cúrcuma, o sal e a pimenta.","Refogue a cebola e o tomate no azeite.","Junte o espinafre e deixe murchar.","Despeje os ovos, tampe e cozinhe em fogo baixo por 5 minutos.","Dobre a omelete e sirva com uma fatia de pão integral."],why:"O ovo é uma proteína completa e barata, e a gema traz colina e vitamina D — nutrientes que muitas mulheres acima de 35 consomem de menos. O espinafre oferece ferro, folato e vitamina K. Já a cúrcuma precisa de gordura para ser melhor absorvida, e o azeite resolve isso.",photo:"omelete amarela de cúrcuma com espinafre e tomate dobrada em prato claro, folhas de espinafre e ovo inteiro ao lado, prato rústico sobre linho creme e mesa de madeira clara, luz de janela"},{id:"peixe-ervas",name:"Peixe assado com ervas e legumes",category:"almoco",emoji:"🐟",time:"30 min",servings:"4 porções",ingredients:["600 g de filé de tilápia ou outro peixe fresco","Suco de 1 limão","2 dentes de alho amassados","Salsinha e cebolinha picadas","½ colher de chá de cúrcuma","2 colheres de sopa de azeite","1 abobrinha, 1 cenoura e 1 pimentão em fatias","Sal e pimenta a gosto"],steps:["Tempere o peixe com limão, alho, cúrcuma, sal e pimenta.","Distribua os legumes em uma assadeira e regue com azeite.","Asse por 10 minutos a 200 °C.","Junte o peixe sobre os legumes e asse por mais 12 minutos.","Finalize com salsinha e cebolinha."],why:"Peixe é proteína magra e de fácil digestão, com gorduras que ajudam a pele e o coração. A assadeira de legumes aumenta o volume da refeição e garante fibras e betacaroteno sem fritura. Uma refeição completa em uma única forma: menos louça e mais tempo para você.",photo:"filé de peixe assado com ervas sobre legumes coloridos na assadeira, pedal de limão e salsinha, fundo de mesa de madeira rústica e pano de linho, luz natural de fim de tarde"},{id:"feijao-couve",name:"Feijão caseiro com couve refogada",category:"almoco",emoji:"🫘",time:"30 min",servings:"4 porções",ingredients:["2 xícaras de feijão carioca cozido","½ cebola picada","2 dentes de alho","1 colher de chá de cúrcuma","2 xícaras de couve em tiras finas","1 colher de sopa de azeite","Louro, sal e pimenta a gosto"],steps:["Refogue a cebola e o alho no azeite.","Acrescente o feijão, a cúrcuma, o louro e ½ xícara de água.","Cozinhe por 10 minutos para encorpar e tempere.","Na hora de servir, refogue a couve rapidamente no azeite.","Sirva com arroz integral e uma fatia de laranja."],why:"Feijão é proteína vegetal, fibra e ferro por um preço que cabe em qualquer orçamento. Ele ajuda a estabilizar o açúcar no sangue, principalmente quando acompanhado de arroz integral. A couve refogada soma cálcio e vitamina K, e a laranja ajuda na absorção do ferro do prato.",photo:"panela de barro com feijão carioca cremoso, couve refogada verde ao lado e fatias de laranja, çolher de madeira, mesa rústica com cebola e alho, luz calorosa de cozinha brasileira"},{id:"abobrinha-frango",name:"Bowl de abobrinha com frango e tomate",category:"almoco",emoji:"🥒",time:"25 min",servings:"3 porções",ingredients:["2 abobrinhas médias em tiras","300 g de frango desfiado já cozido","4 tomates maduros picados","1 cebola picada","2 dentes de alho","Manjericão fresco","1 colher de sopa de azeite","Sal, pimenta e cúrcuma a gosto"],steps:["Refogue cebola e alho no azeite.","Junte os tomates, o sal e o manjericão, cozinhe por 10 minutos.","Acrescente o frango desfiado e a cúrcuma; misture.","Salteie as abobrinhas em outra frigideira por 4 minutos.","Monte o bowl com a abobrinha e o molho de frango."],why:"O molho feito com tomates de verdade tem licopeno e nenhum açúcar escondido, diferente dos molhos prontos. A abobrinha tem pouquíssimas calorias e muita água, o que enche o prato. O frango desfiado garante a proteína e transforma sobras em almoço novo — economia e menos desperdício.",photo:"bowl colorido com tiras de abobrinha, molho caseiro de tomate e frango desfiado, manjericão fresco por cima, prato de cerâmica verde, tomates e abobrinha sobre madeira rústica, luz de meio-dia"},{id:"bowl-grao",name:"Bowl de grão-de-bico e batata-doce assada",category:"almoco",emoji:"🥙",time:"35 min",servings:"3 porções",ingredients:["2 xícaras de grão-de-bico cozido","1 batata-doce grande em cubos","1 abobrinha em fatias","1 pimentão em tiras","½ cebola roxa em fatias","2 colheres de sopa de azeite","Suco de 1 limão","Hortelã e gergelim a gosto","Cúrcuma, sal e pimenta a gosto"],steps:["Misture a batata-doce, a abobrinha e o pimentão com azeite e cúrcuma.","Asse a 200 °C por 25 minutos, virando na metade.","Tempere o grão-de-bico com limão, sal e pimenta.","Monte os bowls com os legumes assados e o grão-de-bico.","Finalize com cebola roxa, hortelã e gergelim."],why:"Grão-de-bico combina proteína vegetal e fibra, e a batata-doce assada vira carboidrato de liberação lenta, que dá energia sem derrubar você depois. Os legumes assados trazem antioxidantes e deixam o prato colorido, sinal de nutrientes variados. O azeite ajuda na saciedade e no sabor.",photo:"bowl brasileiro com grão-de-bico, batata-doce assada, abobrinha, pimentão e cebola roxa, molho de limão e hortelã, tigela de cerâmica rústica, assadeira ao fundo, luz dourada"}],pv=[{id:"bolo-banana",name:"Bolo de banana e aveia (sem açúcar)",category:"lanche",emoji:"🍌",time:"35 min",servings:"8 fatias",ingredients:["3 bananas maduras amassadas","3 ovos","1 e ½ xícara de aveia em flocos","½ xícara de leite","1 colher de sopa de mel","1 colher de sopa de óleo de coco","1 colher de chá de canela","1 pitada de sal"],steps:["Bata as claras em neve bem firmes e reserve.","Misture as gemas, a banana, o leite, o mel, o óleo e a canela.","Acrescente a aveia e mexa até incorporar.","Envolva as claras delicadamente, sem bater.","Asse em forma untada a 180 °C por 25 a 30 minutos."],why:"A banana madura adoça de verdade, então não precisa de açúcar nem de farinha branca. A aveia traz fibras que segura a fome e as claras em neve dão leveza para o bolo crescer. Um lanche caseiro evita o bolo da padaria, que costuma vir com açúcar, gordura hidrogenada e culpa.",photo:"fatia de bolo caseiro de banana e aveia em prato de cerâmica crua, canela por cima, bananas inteiras, aveia em pote de vidro e mel sobre mesa de madeira, luz quente de tarde"},{id:"bolo-cenoura",name:"Bolo de cenoura com mel",category:"lanche",emoji:"🥕",time:"40 min",servings:"8 fatias",ingredients:["3 cenouras médias cozidas","3 ovos","1 xícara de aveia em flocos batida no liquidificador","½ xícara de castanhas picadas","3 colheres de sopa de mel","2 colheres de sopa de óleo de coco","1 colher de chá de canela","1 pitada de sal"],steps:["Bata a cenoura, as gemas, o mel, o óleo e o leite no liquidificador.","Transfira para uma tigela e misture a aveia moída e as castanhas.","Bata as claras em neve e envolva na massa.","Asse a 180 °C por cerca de 30 minutos.","Espere esfriar antes de cortar em fatias."],why:"A cenoura cozida dá doçura e betacaroteno, o mel entra em pouca quantidade e a aveia moída substitui a farinha branca. As castanhas somam gorduras boas e magnésio, mineral importantíssimo para quem anda estressada. É doce de verdade, sem o pico de açúcar do bolo tradicional.",photo:"fatia de bolo de cenoura dourado caseiro com cobertura simples de mel e castanhas, cenouras frescas e farinha de aveia ao redor, prato rústico e linho, luz natural calorosa"},{id:"cookies-aveia",name:"Cookies de aveia, banana e canela",category:"lanche",emoji:"🍪",time:"20 min",servings:"10 cookies",ingredients:["2 bananas maduras","1 xícara de aveia em flocos","2 colheres de sopa de mel","1 punhado de castanhas picadas","1 colher de chá de canela","1 colher de sopa de óleo de coco derretido"],steps:["Amasse bem as bananas e misture o mel e o óleo.","Junte a aveia, a canela e as castanhas.","Modele bolinhas e achatE-as levemente com as mãos.","Asse a 180 °C por 12 a 15 minutos.","Deixe esfriar para ficarem firmes."],why:"A combinação banana + aveia cria um cookie úmido e docinho, sem ingredientes de padaria industrializada. A canela ajuda a diminuir a vontade de doces ao longo do dia, e as castanhas contribuem com gorduras boas. Faça a porção da semana e leve na bolsa para os dias de correria.",photo:"cookies rústicos de aveia e banana em tábua de madeira com lascas de castanha, banana e canela em pau, pano de linho, luz quente e textura crocante visível"},{id:"chips-batata",name:"Chips de batata-doce assada",category:"lanche",emoji:"🍠",time:"25 min",servings:"2 porções",ingredients:["2 batatas-doces médias em fatias finas","1 colher de sopa de azeite","1 pitada de sal","1 pitada de páprica natural","1 folha de tomilho ou orégano"],steps:["Corte a batata-doce em fatias bem finas e seque com um pano.","Misture com o azeite, o sal, a páprica e o orégano.","Distribua sem sobrepor em uma assadeira forrada.","Asse a 190 °C por 20 minutos, virando na metade."],why:"A batata-doce tem fibras e betacaroteno, e assar com pouco azeite evita a fritura e o óleo reutilizado, que inflamam o corpo. Esse chips resolve o desejo de algo crocante à tarde sem a dentada de saco de salgadinho. Deixe esfriar na forma: é assim que fica sequinho.",photo:"chips de batata-doce assada dourados e crocantes amontoados em tigela de cerâmica, páprica e sal salpicados, batatas-doces cruas ao lado, luz natural sobre mármore claro"},{id:"mix-frutas",name:"Mix de frutas com canela e hortelã",category:"lanche",emoji:"🍍",time:"10 min",servings:"2 porções",ingredients:["1 fatia de abacaxi em cubos","½ mamão em cubos","1 banana em rodelas","Suco de ½ limão","1 colher de chá de mel","Canela e hortelã a gosto"],steps:["Corte as frutas em pedaços do mesmo tamanho.","Misture o limão e o mel, que ajudam a conservar.","Junte as frutas e envolva bem.","Finalize com canela e folhas de hortelã."],why:"Frutas inteiras trazem fibras, água e vitaminas — o que o açúcar da fruta não faz sozinho é causar o mesmo estrago de um doce industrializado. A canela e o mel mínimo deixam a sobremesa mais gostosa sem exagero. Se puder, coma a casca do abacaxi e do mamão: é lá que está boa parte da fibra.",photo:"salada de frutas colorida em tigela de cerâmica clara com abacaxi, mamão, banana, hortelã e canela, limão cortado e colher de madeira, luz fresca de tarde"},{id:"pao-queijo-batata",name:"Pão de queijo de batata-doce",category:"lanche",emoji:"🧀",time:"35 min",servings:"12 unidades",ingredients:["1 batata-doce média cozida e amassada","1 xícara de polvilho doce","1 ovo","½ xícara de queijo minas ralado","1 colher de sopa de azeite","Sal e orégano a gosto"],steps:["Misture a batata-doce, o polvilho, o ovo, o azeite e o sal.","Junte o queijo e o orégano e amasse até a massa desgrudar.","Modele bolinhas com as mãos úmidas.","Asse a 180 °C por 20 a 25 minutos, até dourar."],why:"A batata-doce substitui parte do polvilho, aumentando fibras e nutrientes do tradicional pão de queijo. Ovo e queijo minas somam proteína e cálcio, então o lanche sustenta mais do que três pães de queijo comprados. É assado, não frito: menos gordura, mais sabor.",photo:"pães de queijo dourados de batata-doce em cesta rústica com queijo minas e batata-doce assada ao lado, vapor sutil, mesa de madeira e linho, luz quente de forno"},{id:"mousse-abacate",name:"Mousse de abacate com cacau",category:"lanche",emoji:"🍫",time:"10 min + geladeira",servings:"2 porções",ingredients:["1 abacate maduro","2 colheres de sopa de cacau em pó natural","1 colher de sopa de mel","Suco de ½ limão","2 colheres de sopa de leite de coco caseiro","1 pitada de canela"],steps:["Bata o abacate com o cacau, o mel, o limão e o leite de coco.","Prove e ajuste o doce se precisar.","Distribua em potinhos e salpique canela.","Leve à geladeira por pelo menos 1 hora antes de servir."],why:"O abacate vira textura de mousse e traz gordura boa; o cacau natural acrescenta magnésio e sabor de chocolate sem chantilly. Como não leva leite condensado nem creme de leite, é uma sobremesa bem mais leve. Vai parecer que você está se dando um presente — porque está.",photo:"mousse de chocolate natural em dois potes de vidro com cacau polvilhado e raspas de cacau, abacate partido e colher de cerâmica, fundo de mármore claro e linho, luz suave"},{id:"torradinha-mandioquinha",name:"Torradinhas de batata-doce com pasta de grão-de-bico",category:"lanche",emoji:"🫘",time:"25 min",servings:"2 porções",ingredients:["1 batata-doce grande em fatias de 1 cm","1 xícara de grão-de-bico cozido","Suco de 1 limão","1 dente de alho","1 colher de sopa de azeite","½ colher de chá de cúrcuma","Sal, pimenta e salsinha a gosto"],steps:["Asse as fatias de batata-doce a 200 °C por 20 minutos.","Bata o grão-de-bico com limão, alho, azeite e cúrcuma.","Se precisar, adicione 1 colher de água para dar cremosidade.","Tempere a pasta e espalhe sobre as torradinhas já frias.","Finalize com salsinha e pimenta."],why:"Essa dupla troca o pãozinho de padaria por fatias de batata-doce e a margarina por uma pasta de grão-de-bico caseira, cheia de fibra e proteína vegetal. É crocante, cremosa e muito mais saciante. Você pode fazer a pasta no domingo e usar durante a semana.",photo:"torradinhas de batata-doce com pasta de grão-de-bico colorida de cúrcuma, salsinha e gergelim por cima, prato rústico sobre madeira clara, tigela de pasta ao lado e limão"},{id:"cenoura-pepino",name:"Palitos de cenoura e pepino com pasta de abacate",category:"lanche",emoji:"🥒",time:"10 min",servings:"2 porções",ingredients:["2 cenouras cortadas em palitos","1 pepino cortado em palitos","1 abacate maduro","Suco de 1 limão","1 colher de sopa de azeite","Cúrcuma, sal e hortelã a gosto"],steps:["Lave os legumes e corte em palitos.","Amasse o abacate com limão, azeite, sal e cúrcuma.","Pique a hortelã e misture à pasta.","Sirva os palitos com a pasta no centro."],why:"Cenoura e pepino são crocantes, ricos em água e super baratos — ideais para a hora em que você quer mastigar algo, não comer uma refeição inteira. A pasta de abacate substitui maionese com gorduras boas e limão. Deixe os palitos já cortados na geladeira para não ter desculpa.",photo:"palitos frescos de cenoura e pepino ao redor de uma tigela de cerâmica com pasta verde de abacate e hortelã, fatias de limão e azeite, mesa de mármore e luz natural"},{id:"banana-assada",name:"Banana assada com aveia e canela",category:"lanche",emoji:"🍯",time:"20 min",servings:"2 porções",ingredients:["2 bananas maduras cortadas ao meio","3 colheres de sopa de aveia em flocos","1 colher de sopa de mel","1 colher de chá de canela","1 colher de sopa de castanhas picadas","1 colher de chá de óleo de coco"],steps:["Distribua as bananas em uma assadeira untada.","Misture a aveia, as castanhas e a canela e distribua por cima.","Regue com o mel e o óleo de coco.","Asse a 180 °C por 15 minutos e sirva ainda quentinho."],why:"Assar a banana intensifica a doçura natural, então a sobremesa parece muito mais doce do que é. A aveia e as castanhas transformam fruta em lanche completo, com fibras e gorduras boas. Sirva com iogurte natural para virar um café da manhã de domingo.",photo:"bananas assadas com aveia crocante, mel e canela em assadeira rústica, porção em prato com castanhas, luz dourada de forno sobre madeira e linho creme"}],hv=[{id:"sopa-legumes",name:"Sopa de legumes com gengibre",category:"jantar",emoji:"🥣",time:"30 min",servings:"4 porções",ingredients:["1 abobrinha, 2 cenouras e 1 chuchu picados","1 cebola e 2 dentes de alho","1 pedaço de 3 cm de gengibre","1 xícara de espinafre","1,2 litro de água","1 colher de sopa de azeite","Sal, pimenta e cebolinha a gosto"],steps:["Refogue a cebola, o alho e o gengibre no azeite.","Junte os legumes, a água e o sal.","Cozinhe por 20 minutos, até os legumes ficarem macios.","Amasse parte dos legumes com um garfo para engrossar o caldo.","Finalize com espinafre, pimenta e cebolinha."],why:"À noite, seu corpo não precisa de uma refeição pesada para dormir. Essa sopa tem muitos legumes e água, o que dá volume e aquece, com pouco de tudo. O gengibre ajuda a digestão e o azeite ajuda o corpo a absorver as vitaminas que precisam de gordura (A, D, E e K). Se quiser mais proteína, desfie um ovo cozido dentro.",photo:"sopa de legumes caseira com pedaços coloridos de cenoura, abobrinha e espinafre em tigela de cerâmica, vapor subindo, gengibre e ervas frescas ao lado, pano de linho"},{id:"caldo-verde",name:"Caldo verde de couve com batata-doce",category:"jantar",emoji:"🥬",time:"30 min",servings:"4 porções",ingredients:["2 batatas-doces médias em cubos","2 xícaras de couve em tiras finas","1 cebola picada","2 dentes de alho","1 litro de água","1 colher de sopa de azeite","Sal, pimenta e cúrcuma a gosto"],steps:["Cozinhe a batata-doce com metade da água até amaciar.","Bata no liquidificador até ficar cremoso.","Refogue a cebola e o alho no azeite.","Junte o creme de batata-doce, o restante da água e a cúrcuma.","Desligue, acrescente a couve crua e tampe por 2 minutos."],why:"A couve fica com um verde vivo quando entra no fim do preparo, preservando mais vitamina C e folato. A batata-doce deixa o caldo cremoso sem nata, creme de leite ou caldo de pacote. É uma sopa que abraça, cabe na rotina e não pesa antes de dormir.",photo:"caldo verde cremoso com couve em tiras e batata-doce em tigela de barro escura, fio de azeite e pimenta-do-reino, couve fresca sobre madeira rústica e vela suave ao fundo"},{id:"salada-morna-abobora",name:"Salada morna de abóbora com gergelim",category:"jantar",emoji:"🎃",time:"30 min",servings:"3 porções",ingredients:["600 g de abóbora em cubos","1 colher de chá de cúrcuma","2 colheres de sopa de azeite","2 punhados de rúcula","½ cebola roxa em fatias","2 colheres de sopa de sementes de gergelim","Suco de 1 limão","Sal e pimenta a gosto"],steps:["Misture a abóbora com o azeite, a cúrcuma e o sal.","Asse a 200 °C por 25 minutos, até dourar nas pontas.","Monte a rúcula e a cebola roxa em uma travessa.","Distribua a abóbora ainda morna por cima.","Regue com limão, salpique gergelim e sirva."],why:"A abóbora assada tem doçura natural e betacaroteno, e o gergelim acrescenta cálcio e gorduras boas. Servir morna ajuda a digestão e mantém o jantar leve sem parecer salada de dieta. Se quiser completar, adicione ovos cozidos ou frango desfiado — proteína na medida.",photo:"salada morna de abóbora assada dourada com rúcula, cebola roxa, gergelim e limão em travessa de cerâmica, abóbora assada na assadeira ao fundo, luz quente de fim de dia"},{id:"wrap-tapioca-frango",name:"Wrap de tapioca com frango e espinafre",category:"jantar",emoji:"🌯",time:"15 min",servings:"2 porções",ingredients:["4 colheres de sopa de goma de tapioca","200 g de frango cozido desfiado","1 xícara de espinafre","½ tomate picado","2 colheres de sopa de azeite","Cúrcuma, sal e orégano a gosto"],steps:["Faça dois discos de tapioca em frigideira quente e reserve.","Refogue o tomate no azeite com cúrcuma e sal.","Junte o frango e o espinafre e cozinhe por 3 minutos.","Recheie os discos, acrescente orégano e enrole.","Sirva com uma salada simples de folhas."],why:"Um jantar rápido precisa de proteína e vegetais; a tapioca aqui é só o pão que segura tudo. O frango desfiado tem alta densidade de proteína e pouca gordura, e o espinafre oferece ferro e fibra. Trocando o wrap de padaria por tapioca, você corta gordura industrializada e ganha leveza.",photo:"wrap de tapioca dourado cortado ao meio mostrando recheio de frango, espinafre e tomate, tábua de madeira, salada verde e limão ao redor, luz natural de cozinha"},{id:"omelete-forno",name:"Omelete de forno com brócolis e tomate",category:"jantar",emoji:"🥦",time:"25 min",servings:"3 porções",ingredients:["5 ovos","1 xícara de brócolis cozido","1 tomate em rodelas","½ cebola picada","2 colheres de sopa de queijo minas ralado","1 colher de sopa de azeite","Sal, pimenta e cúrcuma a gosto"],steps:["Bata os ovos com sal, pimenta e cúrcuma.","Refogue a cebola e o brócolis no azeite.","Coloque os legumes em uma forma e despeje os ovos.","Distribua o tomate e o queijo por cima.","Asse a 180 °C por 18 minutos, até firmar."],why:"Ovo no jantar não é problema nenhum: é proteína e nutrientes como colina, que o corpo usa para funções ligadas à memória e ao humor. O brócolis traz fibras e compostos que ajudam o fígado a fazer seu trabalho. Essa omelete é prático, versátil e fica pronta no forno enquanto você toma banho.",photo:"omelete de forno dourada com brócolis e rodelas de tomate em assadeira de cerâmica, porção em prato com salada verde, queijo minas e ervas, luz aconchegante de jantar"},{id:"frango-abobora",name:"Frango grelhado com purê de abóbora",category:"jantar",emoji:"🍗",time:"30 min",servings:"3 porções",ingredients:["2 filés de frango em fatias","Suco de 1 limão","2 dentes de alho amassados","600 g de abóbora cozida","1 pedaço de 2 cm de gengibre","1 colher de sopa de azeite","Sal, pimenta e ervas frescas a gosto"],steps:["Tempere o frango com limão, alho, sal e pimenta.","Grelhe em frigideira quente por 4 minutos de cada lado.","Bata a abóbora cozida com gengibre, azeite e sal.","Ajuste a consistência do purê com a água do cozimento.","Sirva o frango fatiado sobre o purê com ervas."],why:"Aqui, o filé de frango magro entrega proteína essencial para manter músculo depois dos 35. O purê de abóbora tem menos amido que o de batata e mais fibras e betacaroteno. Jantar assim ajuda a chegar ao café da manhã seguinte com fome de comida, não de açúcar.",photo:"frango grelhado fatiado com marcas de grelha sobre purê de abóbora laranja, ramos de ervas e limão, prato de cerâmica escura em mesa rústica, luz suave de fim de tarde"},{id:"sopa-lentilha",name:"Sopa de lentilha com cenoura e cúrcuma",category:"jantar",emoji:"🌱",time:"35 min",servings:"4 porções",ingredients:["1 xícara de lentilha crua","2 cenouras em cubos","1 cebola picada","2 dentes de alho","1 colher de chá de cúrcuma","1 litro de água","1 colher de sopa de azeite","Salsinha, sal e pimenta a gosto"],steps:["Refogue a cebola e o alho no azeite.","Junte a lentilha, a cenoura, a cúrcuma e a água.","Cozinhe por 25 minutos, até a lentilha amaciar.","Se quiser, bata metade da sopa e volte para a panela.","Finalize com salsinha e um fio de azeite."],why:"Lentilha é legume que carrega proteína vegetal, ferro e fibras que alimentam as bactérias boas do intestino. Cozinhar com cúrcuma e azeite melhora a absorção dos compostos dela. É aquele jantar que custa barato, rende dois dias e deixa uma boa sensação.",photo:"sopa de lentilha cremosa com cenoura em tigela de cerâmica rústica, fio de azeite, salsinha e pimenta, lentilhas cruas e cenoura sobre madeira escura, vapor delicado"},{id:"berinjela-gratinada",name:"Berinjela gratinada com tomate e ovo",category:"jantar",emoji:"🍆",time:"35 min",servings:"3 porções",ingredients:["1 berinjela grande em fatias","4 tomates maduros picados","1 cebola picada","2 dentes de alho","3 ovos","2 colheres de sopa de queijo minas","Manjericão, azeite, sal e pimenta a gosto"],steps:["Grelhe as fatias de berinjela com um fio de azeite.","Refogue a cebola, o alho e o tomate por 8 minutos.","Monte camadas de berinjela e molho em travessa.","Abra cavidades, quebre os ovos por cima e salpique queijo.","Asse a 200 °C por 15 minutos e finalize com manjericão."],why:"A berinjela é leve e cheia de água e fibras, e o molho de tomate caseiro traz licopeno sem aromatizantes. Os ovos garantem a proteína do jantar e o queijo minas um toque de sabor. Polvilhar pouco queijo é diferente do monte de mussarela: sabor sem exagero é a regra da casa.",photo:"berinjela gratinada em camadas com molho de tomate e ovo por cima em assadeira de cerâmica, manjericão fresco, tomates e berinjela ao fundo, luz quente de forno"},{id:"crepioca-queijo",name:"Crepioca de queijo com salada de folhas",category:"jantar",emoji:"🌿",time:"10 min",servings:"1 porção",ingredients:["1 ovo","2 colheres de sopa de goma de tapioca","1 colher de sopa de queijo minas ralado","Orégano e sal a gosto","1 punhado de folhas verdes","½ tomate em fatias","Azeite e limão para temperar"],steps:["Bata o ovo com a tapioca, sal e orégano.","Despeje na frigideira quente com um fio de azeite.","Vire, adicione o queijo e dobre ao meio.","Tempere as folhas com azeite e limão.","Sirva a crepioca com a salada."],why:"É o jantar dos dias em que você chega destruída: 10 minutos, poucos ingredientes e nenhuma entrega de comida. A proteína do ovo e do queijo sustenta, e a salada preenche o prato com volume e vitaminas. Jantar leve de verdade não é jantar de fome.",photo:"crepioca dourada dobrada com queijo derretido em prato raso, salada verde fresca com tomate e limão ao lado, garfo, farinha de tapioca em pote de vidro, luz natural clara"},{id:"panqueca-abobrinha",name:"Panqueca de abobrinha com frango desfiado",category:"jantar",emoji:"🥞",time:"30 min",servings:"3 porções",ingredients:["2 abobrinhas raladas e espremidas","3 ovos","3 colheres de sopa de aveia","250 g de frango cozido e desfiado","4 tomates maduros","1 cebola picada","1 colher de sopa de azeite","Manjericão, sal e pimenta a gosto"],steps:["Misture a abobrinha, os ovos, a aveia e o sal.","Faça discos em frigideira quente e doure dos dois lados.","Refogue a cebola e os tomates; junte o frango e o manjericão.","Recheie as panquecas, enrole e disponha em uma assadeira.","Asse por 10 minutos a 180 °C e sirva."],why:"A massa de abobrinha não leva farinha branca nem conservantes, e o recheio é frango com molho de tomate feito na panela. Fibras da abobrinha e da aveia + proteína do frango + líquidos do tomate: um jantar completo que não pesa e ainda rende sobras para o almoço.",photo:"panquecas naturais de abobrinha recheadas com frango e molho de tomate em travessa, manjericão fresco por cima e queijo ralado leve, mesa de madeira clara e linho, luz quente de jantar"}],gv=[{id:"cha-gengibre",name:"Chá de gengibre com limão e mel",category:"chas",emoji:"🍵",time:"8 min",servings:"1 caneca",ingredients:["1 pedaço de 3 cm de gengibre fresco em fatias","250 ml de água","Suco de ½ limão","1 colher de chá de mel","1 rodela de limão para servir"],steps:["Ferva a água com o gengibre por 5 minutos.","Desligue e deixe descansar por 2 minutos.","Coe, acrescente o limão e o mel.","Sirva morno, sem ferver o mel."],why:"O gengibre aquece e ajuda o sistema digestivo a se mexer, o que faz diferença em dias de inchaço. O limão adiciona vitamina C e um sabor que engana a vontade de tomar refrigerante. O mel é um adoçante natural, mas ainda é açúcar: use pouco e não espere que o chá, sozinho, emagreça.",photo:"caneca de cerâmica rústica com chá dourado de gengibre, fio de mel escorrendo de colher de pau, rodelas de limão e gengibre fresco sobre mesa de madeira, luz aconchegante"},{id:"cha-mate-laranja",name:"Chá-mate com canela e casca de laranja",category:"chas",emoji:"🍊",time:"10 min",servings:"2 canecas",ingredients:["2 colheres de sopa de chá-mate","500 ml de água","Casca de ½ laranja","1 pau de canela","1 rodela de laranja para servir"],steps:["Ferva a água e desligue antes de juntar o chá-mate.","Acrescente a casca de laranja e a canela e tampe.","Deixe descansar por 5 minutos e coe.","Sirva quente com uma rodela de laranja."],why:"O chá-mate tem cafeína e pode dar aquela disposição da manhã sem os vários açúcares da lata de refrigerante. Canela e casca de laranja perfumam o chá e deixam a bebida gostosa sem açúcar. Para quem sente ansiedade, prefira a cafeína só até o início da tarde.",photo:"chá-mate claro em xícara de cerâmica com casca de laranja, pau de canela e rodela de laranja fresca, pano de linho e laranja inteira na mesa de madeira, luz da manhã"},{id:"shot-curacuma",name:"Shot de cúrcuma, gengibre e limão",category:"chas",emoji:"🟠",time:"5 min",servings:"2 shots",ingredients:["1 colher de chá de cúrcuma em pó","1 pedaço de 2 cm de gengibre","Suco de 1 limão","1 pitada de pimenta-do-reino","50 ml de água"],steps:["Bata todos os ingredientes no liquidificador.","Coe com uma peneira fina.","Divida em dois copinhos pequenos.","Beba na hora, sem adoçar."],why:"A cúrcuma é um tempero anti-inflamatório e a pimenta-do-reino ajuda o corpo a absorver melhor o composto ativo dela. O limão oferece vitamina C e o gengibre uma levantada no ânimo. Shot é concentrado e não milagroso: ele complementa a refeição, nunca substitui.",photo:"dois copinhos de shot laranja vibrante de cúrcuma e gengibre, polvilhados com pimenta, cúrcuma fresca e limão ao redor sobre mármore claro, luz forte de manhã"},{id:"shot-laranja",name:"Shot de laranja e gengibre",category:"chas",emoji:"🧡",time:"5 min",servings:"2 shots",ingredients:["Suco de 2 laranjas","1 pedaço de 2 cm de gengibre","1 colher de chá de mel","1 pitada de canela"],steps:["Esprema as laranjas e reserve.","Bata o suco com o gengibre no liquidificador.","Coe, se quiser, e misture o mel e a canela.","Sirva em dois copinhos na hora."],why:"Laranja é uma fonte acessível de vitamina C, e o gengibre dá aquele “acorda” natural. Como é doce pela fruta, use pouco ou nenhum mel. A vitamina C ajuda na absorção de ferro da refeição, então esse shot cai muito bem antes do almoço com feijão.",photo:"shot cítrico de laranja com gengibre em copo pequeno, laranjas partidas e gengibre sobre mesa de madeira clara, gotas de suco e canela, luz solar brilhante"},{id:"cha-hibisco",name:"Chá de hibisco com canela",category:"chas",emoji:"🌺",time:"8 min",servings:"2 canecas",ingredients:["2 colheres de sopa de flores de hibisco seco","500 ml de água","1 pau de canela","1 rodela de laranja (opcional)"],steps:["Ferva a água e desligue o fogo.","Acrescente o hibisco e a canela.","Tampe e deixe descansar por 5 minutos.","Coe e sirva quente ou gelado com laranja."],why:"O hibisco é conhecido por ajudar na hidratação e na pressão arterial, e a canela adoça de mentira: o cheiro e o sabor acabam matando a vontade de açúcar. É uma bebida linda, vermelha e barata, comprada a granel em feira e mercado comum. Não o trate como remédio para pressão: se você tem hipertensão ou toma medicação, converse com seu médico.",photo:"chá vermelho vibrante de hibisco em caneca de vidro, flores secas de hibisco, pau de canela e rodela de laranja, vapor suave, mesa de madeira com linho, luz quente de tarde"},{id:"cha-hortela",name:"Chá de hortelã com gengibre e limão",category:"chas",emoji:"🌿",time:"8 min",servings:"2 canecas",ingredients:["1 punhado de folhas de hortelã frescas","2 cm de gengibre em fatias","500 ml de água","Suco de ½ limão","Mel a gosto"],steps:["Ferva a água com o gengibre por 5 minutos.","Desligue e adicione a hortelã.","Tampe e deixe descansar por 3 minutos.","Coe, adicione o limão e adoçe com mel."],why:"A hortelã tem um efeito calmante no intestino e ajuda com aquela sensação de estufamento depois do almoço. O gengibre continua sendo o amigo da digestão, e o limão dá frescor para você beber água de verdade. Esse é o chá para substituir o docinho da tarde.",photo:"caneca de chá verde-claro com hortelã fresca, gengibre e limão, folhas de hortelã ao redor sobre mesa de mármore, luz suave da tarde e vapor delicado"},{id:"suco-abacaxi-hortela",name:"Suco de abacaxi com hortelã",category:"chas",emoji:"🍍",time:"7 min",servings:"2 copos",ingredients:["2 fatias grossas de abacaxi","6 folhas de hortelã","Suco de ½ limão","300 ml de água gelada","Gelo a gosto"],steps:["Corte o abacaxi em pedaços.","Bata com a água, a hortelã e o limão.","Coe, se preferir, e adoçe com o próprio abacaxi.","Sirva com gelo e uma folha de hortelã."],why:"O abacaxi tem bromelina, uma enzima que ajuda na digestão, e a hortelã dá a sensação de frescor. Esse suco entra no lugar de refrigerantes e sucos de caixinha, que têm açúcar adicionado. Beba devagar, sem exagerar, porque suco de fruta também conta como energia.",photo:"suco amarelo-claro de abacaxi com hortelã em copo de vidro alto com gelo, fatias de abacaxi, hortelã e limão sobre mesa branca sob luz natural intensa"},{id:"cha-camomila",name:"Chá de camomila com canela e mel",category:"chas",emoji:"🌼",time:"7 min",servings:"1 caneca",ingredients:["1 colher de sopa de flores de camomila secas","250 ml de água","1 pau de canela","1 colher de chá de mel"],steps:["Ferva a água e desligue.","Acrescente a camomila e a canela.","Tampe e deixe descansar por 5 minutos.","Coe e adoce com o mel."],why:"A camomila ajuda a baixar o ritmo no fim do dia, e o bom sono é parte importante de uma rotina saudável — dormir mal aumenta a fome no dia seguinte. A canela traz conforto no lugar de um doce noturno. É um ritual simples que avisa ao cérebro: por hoje, chega.",photo:"caneca de chá de camomila dourado com flores secas e pau de canela, mel em pote pequeno e florzinhas sobre mesa de madeira, luz quente e intimista de fim de noite"},{id:"cha-capim-limao",name:"Chá de capim-santo com limão",category:"chas",emoji:"🌾",time:"8 min",servings:"2 canecas",ingredients:["4 folhas grandes de capim-santo","500 ml de água","Suco de ½ limão","Mel a gosto"],steps:["Lave as folhas de capim-santo e corte em pedaços.","Ferva a água e desligue.","Acrescente o capim-santo e tampe por 5 minutos.","Coe, finalize com limão e mel."],why:"O capim-santo tem um aroma cítrico que relaxa e lembra casa de vó. Ele não contém cafeína, então é uma boa bebida para depois do jantar. O limão termina a refeição com frescor e ajuda na hidratação. Beber chá à noite também evita que a fome se disfarce de vontade de beliscar.",photo:"caneca de chá esverdeado com folhas frescas de capim-santo e limão, folhas compridas sobre mesa de madeira rústica, luz baixa e acolhedora, vapor delicado"},{id:"leite-dourado",name:"Leite dourado com cúrcuma e canela",category:"chas",emoji:"🥛",time:"8 min",servings:"1 caneca",ingredients:["200 ml de leite ou bebida vegetal caseira","½ colher de chá de cúrcuma","1 pitada de pimenta-do-reino","½ colher de chá de canela","1 colher de chá de mel"],steps:["Aqueça o leite em fogo baixo, sem ferver.","Junte a cúrcuma, a pimenta e a canela.","Mexa por 3 minutos e desligue.","Acrescente o mel e sirva morno."],why:"O leite dourado é uma bebida quente que acalma e carrega cúrcuma, canela e pimenta — três temperos que trabalham juntos e são melhor absorvidos com o leite. Não é remédio nem substituto de tratamento, mas é um ritual gostoso para fechar o dia sem doce. Se você não tolera leite, use uma bebida vegetal caseira.",photo:"caneca de leite dourado espumante com cúrcuma e canela polvilhadas, pau de canela, açafrão-da-terra e mel sobre madeira com linho, luz amarelada e tranquila de noite"}],bv=[{id:"tapioca-banana-mel",name:"Tapioca doce de banana, mel e canela",category:"cafe",emoji:"🍌",time:"8 min",servings:"1 porção",ingredients:["3 colheres de sopa de goma de tapioca","1 banana madura em rodelas","1 colher de chá de mel","1 colher de chá de canela em pó","1 colher de chá de linhaça dourada (opcional)"],steps:["Peneire a goma na frigideira quente em fogo médio.","Cubra a metade com a banana e salpique canela e linhaça.","Dobre ao meio, abaixe o fogo e deixe apurar por 1 minuto de cada lado.","Finalize com o mel e sirva quente."],why:"A banana madura adoça naturalmente, dispensando açúcar, e a canela ajuda a segurar aquele pico de fome doce do meio da manhã. A linhaça soma ômega-3, gordura boa que ajuda o cérebro e os hormônios — e cada colher faz o intestino agradecer.",photo:"tapioca branca dobrada recheada com rodelas de banana carameladas, mel e canela polvilhada, prato de cerâmica, bananas e mel ao redor"},{id:"panqueca-cacau-banana",name:"Panqueca de cacau com banana",category:"cafe",emoji:"🍫",time:"12 min",servings:"1 porção (3 panquequinhas)",ingredients:["1 banana madura","1 ovo","1 colher de sopa de aveia em flocos","1 colher de sopa de cacau em pó natural","1 colher de chá de mel","Óleo de coco para untar"],steps:["Amasse a banana e misture com o ovo.","Junte a aveia e o cacau até ficar homogêneo.","Aqueça a frigideira untada e faça 3 discos pequenos.","Doure dos dois lados em fogo baixo, com paciência.","Sirva com mel por cima e frutas frescas."],why:"Cacau natural (sem açúcar e sem gordura adicionada, diferente do achocolatado) é uma das fontes mais acessíveis de magnésio, mineral que relaxa e ajuda contra o cansaço. Com banana e ovo, o doce da manhã fica equilibrado e segura a fome por horas.",photo:"pilha de mini panquecas de cacau com rodelas de banana e mel em prato claro, cacau em pó salpicado e frutas ao redor, mesa de madeira"},{id:"mamao-iogurte-chia",name:"Mamão com iogurte, chia e mel",category:"cafe",emoji:"🧡",time:"8 min",servings:"1 porção",ingredients:["½ mamão papaia maduro","1 pote de iogurte natural integral","1 colher de sopa de chia","1 colher de chá de mel","1 colher de sopa de castanhas picadas","Canela a gosto"],steps:["Misture a chia com 2 colheres de água e deixe hidratar por 10 minutos.","Corte o mamão ao meio e retire os caroços.","Recheie a cavidade com o iogurte e a chia hidratada.","Finalize com mel, castanhas e canela.","Coma direto dentro do mamão: menos louça, mais fibra."],why:"A chia hidratada forma um gel rico em ômega-3, cálcio e fibra solúvel, que ajuda a saciedade e o trânsito intestinal. A papaína do mamão auxilia a digestão das proteínas do iogurte e as castanhas completam com minerais como zinco e selênio, importantes para tireoide e imunidade.",photo:"metade de mamão papaia recheda com iogurte natural, chia, castanhas e mel, sobre tábua de madeira com colher de cerâmica, luz natural"},{id:"wrap-ovo-espinafre",name:"Wrap de tapioca com ovo e espinafre",category:"cafe",emoji:"🌯",time:"10 min",servings:"1 porção",ingredients:["3 colheres de sopa de goma de tapioca","2 ovos","2 punhados de espinafre fresco","1 fatia pequena de abacate amassada (opcional)","Azeite, sal e pimenta-do-reino a gosto"],steps:["Faça a tapioca na frigideira quente e reserve dobrada.","Refogue o espinafre com um fio de azeite e sal.","Junte os ovos batidos e mexa até ficarem cremosos.","Recheie a tapioca com ovo, espinafre e abacate por cima.","Dobre, corte ao meio e sirva imediatamente."],why:"O espinafre é das folhas mais ricas em folato e vitamina K — nutrientes ligados à saúde dos ossos e ao bom funcionamento do sangue, dois pontos importantes para a mulher depois dos 35. Ovo e abacate somam proteína e gordura boa, que transformam tapioca simples em café completo.",photo:"wrap de tapioca recheado com ovos mexidos e espinafre, cortado ao meio sobre tábua de madeira limpa, folhas de espinafre ao redor"}],vv=[{id:"tilapia-gengibre-lime",name:"Tilápia crocante com gengibre e limão",category:"almoco",emoji:"🐟",time:"25 min",servings:"3 porções",ingredients:["600 g de filé de tilápia","Suco de 2 limões","2 cm de gengibre ralado","2 dentes de alho amassados","1 punhado de salsinha picada","2 colheres de sopa de azeite","Sal, pimenta e cúrcuma a gosto"],steps:["Tempere o peixe com limão, alho, gengibre, sal, pimenta e cúrcuma.","Aqueça a frigideira com azeite e doure das duas partes.","Ao dourar, regue com mais um pouco de limão.","Sirva com o molho da panela e salsinha por cima."],why:"A tilápia é proteína magra e acessível, e a combinação limão + gengibre realça o sabor sem precisar de molhos prontos ou excesso de sal. Comer peixe duas vezes por semana entrega selênio e vitamina D, dois nutrientes que muitas mulheres brasileiras consomem de menos.",photo:"filé de tilápia dourado com limão e ervas frescas em prato claro, fatias de limão e gengibre ao redor, mesa de madeira clara"},{id:"frango-salada-quente",name:"Salada quente de frango com legumes assados",category:"almoco",emoji:"🥗",time:"30 min",servings:"3 porções",ingredients:["400 g de peito de frango em cubos","2 cenouras em rodelas","1 abobrinha em cubos","½ beterraba em cubos","2 punhados de folhas verdes","Suco de 1 laranja","1 colher de chá de mel","Azeite, cúrcuma, sal e gergelim a gosto"],steps:["Asse os legumes com azeite, sal e cúrcuma por 25 minutos.","Grelhe o frango temperado até dourar.","Distribua as folhas nos pratos e cubra com os legumes mornos.","Junte o frango por cima.","Regue com suco de laranja misturado com mel e finalize com gergelim."],why:"A beterraba é uma leguminosa — calma, brincadeira: é uma raiz muito legal. Seu pigmento roxo são as betalaínas, compostos que ajudam no fluxo de sangue e na energia. Junto com frango e folhas, o prato completa vitaminas de todos os grupos em uma refeição só.",photo:"salada colorida quente com frango dourado, rodelas de cenoura e beterraba assada, folhas verdes e gergelim, travessa clara sobre madeira"},{id:"sopa-milho-gengibre",name:"Sopa de milho com gengibre e couve",category:"almoco",emoji:"🌽",time:"25 min",servings:"4 porções",ingredients:["2 espigas de milho debulhadas (ou 2 xícaras de grãos frescos)","1 batata média em cubos","1 cebola picada","2 cm de gengibre","2 xícaras de couve fatiada","1 litro de água","Azeite, sal e hortelã a gosto"],steps:["Refogue a cebola e o gengibre no azeite.","Junte o milho, a batata e a água; cozinhe por 15 minutos.","Bata metade da sopa e volte para a panela para encorpar.","Ajuste o sal e acrescente a couve crua.","Desligue, tampe por 2 minutos e sirva com hortelã."],why:"O milho integral tem fibra, ferro e betacaroteno, e a batata deixa a sopa cremosa sem nenhum leite industrializado ou creme. A couve crua no final preserva mais vitamina C. Uma sopa simples que matifica a fome de jeito honesto.",photo:"sopa cremosa de milho amarelo com couve verde em tiras e hortelã, tigela de cerâmica clara, espiga de milho e gengibre ao lado, vapor sutil"},{id:"feijao-preto-abobora",name:"Feijão preto cozido com abóbora",category:"almoco",emoji:"🫘",time:"40 min",servings:"5 porções",ingredients:["2 xícaras de feijão preto de molho","300 g de abóbora em cubos","1 cebola picada","3 dentes de alho","2 folhas de louro","1 colher de chá de cúrcuma","Azeite, sal e coentro a gosto"],steps:["Cozinhe o feijão com louro e água até ficar macio.","Refogue a cebola e o alho em azeite.","Junte o refogado ao feijão com a abóbora e a cúrcuma.","Cozinhe por mais 15 minutos, até a abóbora se desfazer.","Ajuste o sal e finalize com coentro fresco."],why:"Feijão preto tem antocianina, o pigmento roxo-antioxidante, além de ferro e fibra. A abóbora cozida na própria panela engrossa o caldo naturalmente, sem precisar de creme industrial — e o ferro vegetal do feijão é absorvido melhor com o limão ou a laranja servidos na refeição.",photo:"panela de ferro com feijão preto cremoso, pedaços de abóbora alaranjada e coentro fresco, colher de pau, mesa rústica"}],xv=[{id:"bolo-mel-coco",name:"Bolo de mel com coco caseiro",category:"lanche",emoji:"🥥",time:"40 min",servings:"8 fatias",ingredients:["3 ovos","½ xícara de coco fresco ou seco ralado","½ xícara de leite de coco caseiro","4 colheres de sopa de mel","1 e ½ xícara de aveia batida no liquidificador","1 pitada de sal","Canela para polvilhar"],steps:["Bata um ovo inteiro com os outros dois gemas, o mel e o óleo.","Misture a aveia moída, o coco e o leite de coco.","Bata as claras em neve e envolva na massa.","Asse em forma untada a 180 °C por cerca de 30 minutos.","Polvilhe canela e mais mel enquanto quente."],why:"O coco natural traz fibras e gorduras saturadas de cadeia média, que dão energia e saciedade. O mel, usado com parcimônia, adoça sem açúcar refinado, e a aveia substitui 100% da farinha branca. Um bolo de lanche que realmente sustenta.",photo:"fatia de bolo dourado com coco ralado por cima em prato rústico, mel escorrendo, coco aberto e mel ao fundo, luz quente"},{id:"cookies-cacau-aveia",name:"Cookies de aveia e cacau natural",category:"lanche",emoji:"🍪",time:"22 min",servings:"12 cookies",ingredients:["2 bananas maduras","1 xícara de aveia em flocos","2 colheres de sopa de cacau em pó natural","2 colheres de sopa de mel","2 colheres de sopa de castanhas picadas","1 pitada de sal","1 colher de chá de óleo de coco derretido"],steps:["Amasse as bananas e misture com o mel e o óleo.","Junte a aveia, o cacau e o sal; mexa bem.","Modele discos e salpique castanhas em cima.","Asse a 180 °C por 15 minutos.","Deixe esfriar antes de provar o primeiro — teste de resistência."],why:"O cacau natural é diferente do achocolatado: não tem açúcar adicionado e traz magnésio e ferro. Com banana no lugar da manteiga e aveia no lugar da farinha branca, esses cookies têm cara de sobremesa, mas comportamento de lanche nutritivo.",photo:"cookies escuros de cacau e aveia em tábua de madeira com lascas de castanha, banana e cacau em pó ao redor, luz dourada"},{id:"pudim-chia-manga",name:"Pudim de chia com manga",category:"lanche",emoji:"🥭",time:"10 min + 2h de geladeira",servings:"2 porções",ingredients:["3 colheres de sopa de chia","200 ml de leite","1 colher de chá de mel","1 xícara de manga em cubos","Raspas de limão e coco ralado para finalizar"],steps:["Misture a chia, o leite e o mel e refrigere por 2 horas.","Bata metade da manga com as raspas de limão.","Monte em potinhos alternando o pudim, a manga batida e os cubos.","Finalize com coco ralado e sirva gelado."],why:"A chia é um dos alimentos mais concentrados do mundo em ômega-3 vegetal, essa gordura boa que ajuda a pele, o cérebro e os hormônios. A manga entrega vitamina A e vitamina C em dose caprichada. É o lanche de domingo que pode virar missão de segunda.",photo:"potinhos de vidro com pudim de chia branco, camadas de manga amarela e coco ralado, manga cortada ao lado, luz fresca"},{id:"granola-mel-aveia",name:"Granola caseira de aveia e mel",category:"lanche",emoji:"🌾",time:"30 min",servings:"10 porções (2 colheres)",ingredients:["2 xícaras de aveia em flocos","½ xícara de castanhas picadas","2 colheres de sopa de gergelim","1 colher de sopa de mel","1 colher de sopa de óleo de coco","Canela e sal a gosto"],steps:["Misture tudo e pressione numa assadeira com fundo.","Asse a 170 °C por 20 minutos, revirando na metade.","Deixe esfriar na própria forma para formar clusters.","Guarde em pote de vidro fechado por até 2 semanas."],why:"Você escolhe exatamente o que entra: nada de xarope de milho nem corantes de granola industrializada. Aveia, castanhas e gergelim formam um cereal rico em fibras, magnésio e cálcio. Sirva com iogurte e fruta: lanche que até as crianças adoram.",photo:"granola caseira dourada com clusters de aveia, castanhas e gergelim em tigela de cerâmica clara, iogurte e frutas ao lado, mel escorrendo"}],yv=[{id:"creme-mandioca-frango",name:"Creme de mandioca com frango desfiado",category:"jantar",emoji:"🍲",time:"35 min",servings:"4 porções",ingredients:["400 g de mandioca (macaxeira) em cubos","200 g de frango cozido desfiado","½ cebola picada","2 dentes de alho","1 pedaço de 2 cm de gengibre","Azeite, sal e cebolinha a gosto"],steps:["Cozinhe a mandioca até amaciar com o gengibre.","Bata a mandioca com a água do cozimento no liquidificador.","Refogue a cebola e o alho no azeite.","Junte o creme de mandioca e o frango à panela.","Aqueça, ajuste o sal e finalize com cebolinha."],why:"A mandioca é um carboidrato de raiz, sem farinha refinada, e tem carboidrato digestível que vira energia com calma. Um jantar quentinho com proteína é o que manda o corpo descansar em vez de enviar você ao pacote de biscoito às 10h.",photo:"creme de mandioca amarelo com fios de frango desfiado em tigela escura, cebolinha e fio de azeite, vapor, colher de pau e mandioca crua ao lado"},{id:"creme-abobrinha-gengibre",name:"Creme de abobrinha com gengibre",category:"jantar",emoji:"🥒",time:"25 min",servings:"4 porções",ingredients:["3 abobrinhas médias","1 batata pequena","½ cebola","2 cm de gengibre","Azeite, sal e hortelã a gosto"],steps:["Corte todos os vegetais em pedaços grandes.","Cozinhe com água temperada com sal por 15 minutos.","Bata no liquidificador até ficar completamente liso.","Ajuste o sal e esmalte com azeite.","Sirva com hortelã e um fio de azeite extra."],why:"Quando em dúvida, faça creme verde: a abobrinha tem vitamina A, potássio e muita água, e a batata faz o papel do amido cremoso sem leite industrializado. Um creme leve antes de dormir é o que facilita um sono bom — e dormir bem ajuda a manter a rotina em dia.",photo:"creme verde-claro de abobrinha em tigela clara decorada, hortelã e fio de azeite, abobrinha crua e gengibre ao lado, mesa de madeira escura"},{id:"salada-abacate-ovo",name:"Salada de abacate com ovo e grão-de-bico",category:"jantar",emoji:"🥑",time:"15 min",servings:"2 porções",ingredients:["1 abacate maduro em fatias","2 ovos cozidos","1 xícara de grão-de-bico cozido","2 punhados de folhas verdes","½ pepino em fatias","Suco de ½ limão","Azeite, cúrcuma, sal e gergelim a gosto"],steps:["Lave as folhas e distribua nos pratos.","Tempere o grão-de-bico com limão, sal e azeite.","Monte com abacate, pepino e os ovos em metades.","Polvilhe cúrcuma nos ovos e gergelim em tudo.","Sirva entre 10 minutos — é a beleza do improviso."],why:"Grão-de-bico + ovo = proteína e fibra trabalhando juntas. O abacate traz gordura boa, que aumenta a saciedade e suaviza o crescimento do açúcar do sangue. Um jantar prático, bonito e muito completo em minerais.",photo:"salada fresca com fatias de abacate, metades de ovos cozidos, grão-de-bico, pepino e folhas verdes, limão cortado ao lado, travessa branca"},{id:"arroz-verduras-ovo",name:"Arroz de verduras com ovo mexido",category:"jantar",emoji:"🌱",time:"20 min",servings:"2 porções",ingredients:["1 xícara de arroz integral cozido","2 ovos","1 cenoura pequena ralada","1 xícara de espinafre","½ cebola picada","Azeite, cúrcuma, sal e salsinha a gosto"],steps:["Refogue a cebola e junte a cenoura por 2 minutos.","Acrescente o espinafre, a cúrcuma e o sal.","Junte o arroz cozido e misture.","Faça um ovo mexido à parte com fogo baixo.","Monte os pratos com o arroz de verduras e o ovo por cima."],why:"Esse é o jantar de segunda-feira que resolve qualquer coisa: reaproveita arroz e cozinha só o que é fresco. A cenoura traz betacaroteno, o espinafre ferro, o ovo proteína essencial. E cúrcuma na panela, sempre: sabor e anti-inflamação natural no mesmo gesto.",photo:"tigela com arroz dourado de cúrcuma com cenoura e espinafre, coberto por ovos mexidos cremosos e salsinha, vapor delicado"}],jv=[{id:"hibisco-gelado-laranja",name:"Hibisco gelado com laranja",category:"chas",emoji:"🌺",time:"10 min + geladeira",servings:"2 copos",ingredients:["2 colheres de sopa de flores de hibisco","400 ml de água quente","Suco de 1 laranja","1 colher de chá de mel (opcional)","Gelo e rodela de laranja para servir"],steps:["Infusione o hibisco na água quente por 5 minutos.","Coe e deixe esfriar.","Misture o suco de laranja e o mel.","Sirva bem gelado com gelo e rodela de laranja."],why:"O hibisco é a flor queridinha das feiras por um motivo: hidrata com sabor frutado e vem cheio de antocianinas, os pigmentos antioxidantes que dão a cor vermelha. Sem açúcar, ele substitui refrigerantes e à tarde parece uma pequena festa.",photo:"copo alto de chá gelado vermelho de hibisco com gelo e fatias de laranja flutuando, flores secas e laranjas ao redor sobre mármore"},{id:"suco-manga-gengibre",name:"Suco de manga com gengibre e linhaça",category:"chas",emoji:"🥭",time:"6 min",servings:"2 copos",ingredients:["1 manga madura média","1 pedaço de 2 cm de gengibre","1 colher de sopa de linhaça dourada","300 ml de água gelada","Suco de ½ limão (opcional)"],steps:["Corte a manga em pedaços.","Bata a manga, o gengibre, a linhaça e a água.","Se necessário, ajuste o sabor com limão.","Beba sem coar, na hora, para aproveitar as fibras."],why:"Não coe e não tire a linhaça: ela tem lignanas, compostos vegetais que os pesquisadores associam ao equilíbrio hormonal — ponto importante para a mulher acima de 35. A manga madura adoça naturalmente e entrega vitamina A para a pele e a visão.",photo:"copo de vidro com suco de manga alaranjado e espesso, com rodela de limão, manga fatiada e gengibre ao lado, luz natural"},{id:"agua-mel-gengibre",name:"Água de gengibre com mel (para o dia inteiro)",category:"chas",emoji:"💧",time:"10 min",servings:"1 litro",ingredients:["1 pedaço de 4 cm de gengibre em fatias","½ limão em rodelas","1 colher de chá de mel","4 folhas de hortelã","1 litro de água gelada"],steps:["Aqueça 1 xícara de água e infunde o gengibre por 10 minutos.","Deixe esfriar e coe.","Misture com o restante da água, o mel, o limão e a hortelã.","Deixe na geladeira e vá bebendo ao longo do dia."],why:"Simples, mas excelente: quando a água tem sabor, você bebe mais. E beber água adequadamente ajuda a não confundir sede com fome. Também evita o efeito preguiça intestinal que piora o inchaço. Uma jarra cheia no frigorífico evita uma garrafa de refrigerante na mesa.",photo:"jarra de vidro transparente com água aromatizada, rodelas de limão, fatias de gengibre e folhas de hortelã flutuando, mesa de cozinha com luz do dia"},{id:"cha-digestivo-alecrim",name:"Chá digestivo de alecrim com limão e mel",category:"chas",emoji:"🌿",time:"8 min",servings:"2 canecas",ingredients:["1 raminho fresco de alecrim","Suco de ½ limão","1 colher de chá de mel","500 ml de água"],steps:["Ferva a água e desligue.","Acrescente o alecrim e tampe a panela.","Deixe descansar por 5 minutos e coe.","Finalize com o limão e o mel."],why:"O alecrim tem sido usado há séculos como chá de digestão — ajuda com aquela sensação de estômago pesado depois de almoços maiores. O limão acrescenta vitamina C e o mel dá aquele final gostoso. Não é chá mágico, mas é uma pausa boa de verdade.",photo:"caneca de vidro com chá dourado de alecrim, raminho fresco à vela, rodelas de limão e colher de mel, atmosfera aconchegante"}],pp=[{id:"cafe",label:"Café da manhã",shortLabel:"Café",emoji:"☀️",image:"images/cafe.jpg",chapter:"cafe",subtitle:"Manhãs possíveis, mesmo com dez minutos",quote:"A manhã que você organiza é a manhã que cuida de você.",intro:"Nada de reparar a noite anterior com café preto e culpa. Estas receitas existem para você acordar, comer comida de verdade e chegar ao almoço inteira — não desmontada. Escolha uma, deixe os ingredientes separados na geladeira e comece a manhã sem improvisar doce."},{id:"almoco",label:"Almoço",shortLabel:"Almoço",emoji:"🍲",image:"images/almoco.jpg",chapter:"almoco",subtitle:"Prato colorido, proteína de verdade, sem passar fome",quote:"Um almoço que te sustenta não precisa ser um almoço triste.",intro:"O almoço é a sua âncora. É aqui que você decide se a tarde vai ser de equilíbrio ou de ataque à despensa. As receitas a seguir são refeições completas, com ingredientes simples, feitas para render sobras e continuar gostosas no dia seguinte."},{id:"lanche",label:"Lanche da tarde",shortLabel:"Lanches",emoji:"🧡",image:"images/lanche.jpg",chapter:"lanche",subtitle:"O doce da tarde com ingredientes de feira",quote:"A fome das quatro é um recado, não uma fraqueza.",intro:"Lanchar não estraga nenhum plano. O que estraga é chegar às 16h sem nada por perto e cair no pacote aberto. Aqui, você encontra doces caseiros, crocâncias assadas e opções que realmente seguram a fome até o jantar."},{id:"jantar",label:"Jantar",shortLabel:"Jantar",emoji:"🌙",image:"images/jantar.jpg",chapter:"jantar",subtitle:"Leve, quentinho e sem sete panelas para lavar",quote:"O fim do dia também merece ser gostoso — e não uma penitência.",intro:"Jantar não é prova de abstinência. É a refeição que fecha o dia. Estas receitas são mais leves, ricas em legumes e proteínas, e prontas em até 35 minutos — para você deitar sem barriga pesada e sem a sensação de ter falhado."},{id:"chas",label:"Chás, sucos e shots",shortLabel:"Chás",emoji:"🌿",image:"images/chas.jpg",chapter:"chas",subtitle:"Um ritual para cada hora do dia",quote:"Às vezes, tudo o que você precisa é de uma xícara e cinco minutos.",intro:"Estas bebidas não fazem mágica. Elas fazem companhia, hidratam e ocupam o lugar do refrigerante, do suco de caixinha e do docinho automático. Organizei por hora do dia: manhã para acordar, tarde para digerir, noite para desacelerar."}],hp=[...mv,...bv,...fv,...vv,...pv,...xv,...hv,...yv,...gv,...jv];function zv(r){return hp.filter(d=>d.category===r)}const gp=[{label:"Chás da manhã",subtitle:"Energizantes, para acordar sem susto",ids:["cha-gengibre","cha-mate-laranja","agua-mel-gengibre","suco-manga-gengibre"]},{label:"Shots matinais",subtitle:"Concentrados, para um começo de dia vivo",ids:["shot-curacuma","shot-laranja"]},{label:"Chás da tarde",subtitle:"Digestivos, para a pausa das 15h",ids:["cha-hibisco","cha-hortela","suco-abacaxi-hortela","hibisco-gelado-laranja","cha-digestivo-alecrim"]},{label:"Chás da noite",subtitle:"Desincham e relaxam antes de dormir",ids:["cha-camomila","cha-capim-limao","leite-dourado"]}];function yf(r){return gp.find(d=>d.ids.includes(r))?.label??null}function Xl(r){return pp.find(d=>d
